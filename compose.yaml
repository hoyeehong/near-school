services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_DB: nearschool
      POSTGRES_USER: nearschool
      POSTGRES_PASSWORD: local-only-password
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearschool"]
      interval: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
